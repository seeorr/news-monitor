# GitHub desactiva los workflows programados tras 60 dias sin actividad en el
# repositorio, y lo hace en silencio. Un commit mensual mantiene vivo el cron
# del monitor cuando el sprint acabe y el repositorio deje de moverse.
name: Latido

on:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  latido:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Registrar el latido
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/latido
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/latido
          git commit -m "Latido: mantiene vivos los workflows programados"
          git push
