name: Verificar LLM gratuitos
on:
  workflow_dispatch:
    inputs:
      provider:
        description: Proveedor que se prueba en exclusiva
        type: choice
        options: [groq, openrouter]
        default: groq
      groq_model:
        description: Modelo Groq que se prueba (solo con provider=groq)
        type: choice
        options: [openai/gpt-oss-120b, openai/gpt-oss-20b]
        default: openai/gpt-oss-120b
  push:
    branches: [codex/activar-llm-gratuitos, codex/salud-cuotas-durables]
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Probar noticia pública sin base de datos ni Telegram
        run: npm run verify:llm -- --live
        env:
          # Un solo proveedor por ejecución: así el resultado acredita a ese, no al respaldo.
          LLM_PROVIDERS: ${{ inputs.provider || 'groq' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || secrets.GROQ }}
          # Sin respaldo: la puntuación acredita al modelo elegido. El análisis va siempre
          # con 120b, porque el 20b no analiza (output_parse_failed en la prueba del 14-09).
          GROQ_MODEL_SCORING: ${{ inputs.groq_model || 'openai/gpt-oss-120b' }}
          GROQ_MODEL_ANALYSIS: openai/gpt-oss-120b
          GROQ_MODEL_FALLBACK: none
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
