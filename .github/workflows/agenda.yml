# La agenda macro de la semana, una vez al dia.
#
# Va aparte del monitor porque es otra cosa: el monitor reacciona a lo que ya ha
# pasado, esto dice lo que va a pasar. Y porque una lista de fechas no necesita
# ni modelo ni cascada, asi que no tiene sentido pagar el ciclo entero por ella.
#
# Primera hora de lunes a viernes: antes de que abra Europa y muy antes de que
# publiquen las agencias estadounidenses, que es cuando la lista sirve de algo.
#
# Tres intentos y no uno porque el planificador de GitHub descarta disparos, y
# este workflow es la prueba: el 9 de septiembre de 2026, con el repositorio ya
# publico y el workflow activo, su unico cron ("30 6 * * 1-5") no disparo ni una
# vez. Un cron diario no esta a salvo por ser poco frecuente. Repetir sale gratis
# porque la agenda ya es idempotente por dia —`seen.has(event.id)` corta el
# segundo intento y sale en verde sin enviar nada—, asi que lo peor que puede
# pasar es que se mande una sola vez, que es justo lo que se quiere.
name: Agenda

on:
  schedule:
    - cron: "23 6 * * 1-5"
    - cron: "7 7 * * 1-5"
    - cron: "41 7 * * 1-5"
  workflow_dispatch:

concurrency:
  group: agenda
  cancel-in-progress: false

jobs:
  agenda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MONITOR_MODE: ${{ vars.MONITOR_MODE }}
    steps:
      # Se evalua antes del checkout, de instalar paquetes y de leer secretos,
      # por el mismo motivo que la de brief.yml: una puerta que se abre despues
      # de descargar el codigo ya ha hecho la mitad de lo que queria evitar.
      #
      # Esta faltaba, y era el hueco: la agenda manda Telegram directamente, sin
      # pasar por la cola ni por el ledger de entregas, asi que lo unico que la
      # contenia durante la observacion era estar pausada a mano. El primer cron
      # despues de reactivarla habria enviado en plena fase de captura.
      - name: Comprobar el modo antes de tocar nada
        id: modo
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const trigger = process.env.GITHUB_EVENT_NAME;
          const trusted = ['schedule', 'workflow_dispatch'].includes(trigger);
          // `capture-only` significa observar sin enviar. No admite excepciones
          // por ser la agenda "barata": lo que se esta protegiendo no es el coste.
          const captureOnly = process.env.MONITOR_MODE === 'capture-only';
          const enabled = trusted && !captureOnly;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `enabled=${enabled}\n`);
          NODE

      - uses: actions/checkout@v5
        if: ${{ steps.modo.outputs.enabled == 'true' }}

      - uses: actions/setup-node@v5
        if: ${{ steps.modo.outputs.enabled == 'true' }}
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
        if: ${{ steps.modo.outputs.enabled == 'true' }}

      - name: Enviar la agenda
        if: ${{ steps.modo.outputs.enabled == 'true' }}
        run: npm run agenda
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AGENDA_DIAS: ${{ vars.AGENDA_DIAS }}

      # Si la agenda no sale, hay que enterarse. Es el mismo motivo que en el
      # monitor: un aviso que falla en silencio se confunde con un dia tranquilo.
      - name: Avisar del fallo por Telegram
        if: ${{ failure() && steps.modo.outputs.enabled == 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Sin credenciales de Telegram: no se puede avisar del fallo."
            exit 0
          fi
          curl -sS -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=News Monitor: la agenda macro ha fallado. $RUN_URL" \
            --data "disable_web_page_preview=true" > /dev/null
