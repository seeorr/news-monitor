# Genera el régimen y el resumen, lo guarda en Neon y lo ENVÍA a Telegram.
# Al chat privado, siempre. Al grupo, solo si TELEGRAM_GROUP_CHAT_ID está
# configurado, y solo con la parte compartible (ver src/notify/compartir.ts).
name: Resumen de mañana

on:
  schedule:
    - cron: "19 6 * * 1-5"
    - cron: "49 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: morning-brief
  cancel-in-progress: false

jobs:
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Calcular y guardar régimen
        id: regimen
        continue-on-error: true
        run: npm run regimen
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # El segundo disparo del día encuentra el resumen ya entregado y sale
      # `blocked`, que no es un fallo: es la máquina de estados haciendo su
      # trabajo. Si el grupo no está configurado, su secreto llega vacío, no hay
      # segundo destino y el job no falla por ello.
      - name: Enviar el resumen con sus carencias
        run: npm run brief -- --send
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
      - name: Marcar régimen incompleto
        if: steps.regimen.outcome == 'failure'
        run: |
          echo "Régimen incompleto o fallo de persistencia; revisar disponibilidad de datos y migraciones."
          exit 1
