# Arquitectura actual y activación externa: docs/cadencia-cloudflare.md.
# Los comentarios históricos siguientes explican el respaldo conservado.
# Ciclo de ingesta. Corre en el free tier de GitHub Actions, que es ILIMITADO en
# minutos porque el repositorio es publico.
#
# ── Lo que se probo, y por que se descarto el mismo dia ───────────────────────
#
# El planificador de GitHub no cumple el `schedule`. Medido el 9 de septiembre de
# 2026 con `gh run list`, con el repositorio publico y los workflows activos:
#
#   2026-09-08 22:59 UTC  schedule  success   (+122 min sobre la anterior)
#   2026-09-09 01:10 UTC  schedule  success   (+131 min)
#   2026-09-09 05:58 UTC  schedule  success   (+288 min)
#
# Tres entregas de ~56 en catorce horas, y todas en verde: no falla el ciclo,
# falla la frecuencia. El mismo dia, el cron de UNA VEZ AL DIA de `agenda.yml`
# tampoco disparo. Asi que el problema no es pedirlo demasiado a menudo: el
# disparo es el recurso escaso, y la documentacion de GitHub lo dice sin rodeos
# —"if the load is sufficiently high enough, some queued jobs may be dropped"—.
#
# De ahi salio la salida evidente, que se implemento y se probo: como los minutos
# son gratis y el disparo no, que cada disparo comprara un bloque de ~5 h
# repitiendo el ciclo cada 30 minutos, durmiendo entre vueltas. Funcionaba.
#
# **Se revirtio el mismo dia, y el motivo no es tecnico.** Los terminos de GitHub
# para Actions prohiben "any activity that places a burden on our servers, where
# that burden is disproportionate to the benefits provided to users" y, con
# runners alojados, "any other activity unrelated to the production, testing,
# deployment, or publication of the software project associated with the
# repository". Un runner reservado cinco horas para siete minutos de computo es
# exactamente esa forma, y la sancion que la propia clausula contempla llega
# hasta la suspension de la cuenta. Un monitor que cuesta 0 € pero puede costar
# la cuenta de GitHub no cuesta 0 €.
#
# ── Lo que se hace en su lugar ────────────────────────────────────────────────
#
# Un job corto por disparo, que es el patron que Actions espera, y se juega con
# lo unico que se puede jugar: **cuando** se pide el disparo. Nada de minuto :00
# ni de cuartos en punto —la franja de mas carga y mas descartes es el arranque
# de cada hora—, y dos entradas independientes para no depender de una sola.
#
# La consecuencia hay que decirla en voz alta y no esconderla dentro de un cron:
# **este monitor NO avisa cada media hora.** Pide 48 disparos al dia y GitHub
# entrega los que quiere, que historicamente han sido unos pocos. Lo que si
# hace el sistema es recordar lo procesado. Un hueco puede perder entradas que
# desaparezcan del feed o superen 72 horas. El indice unico evita filas SQL
# duplicadas, no un reenvio si Telegram acepta y luego falla el registro.
#
# Si algun dia la puntualidad importa mas que la pureza del coste cero, la salida
# honesta es un disparador externo con free tier permanente que llame a
# `workflow_dispatch` —cron-job.org, Cloudflare Workers Cron, el cron de Vercel—
# y no fingir que el planificador de Actions es ese disparador.
name: Monitor
run-name: Monitor (${{ inputs.mode != 'auto' && inputs.mode || vars.MONITOR_MODE || 'full' }}) [${{ github.event_name == 'schedule' && 'full' || inputs.profile || 'full' }}]

on:
  schedule:
    # Cada media hora en teoria, en minutos poco concurridos y repartidos entre
    # dos definiciones. En la practica, los que GitHub decida entregar.
    - cron: "7 * * * *"
    - cron: "37 * * * *"
  workflow_dispatch:
    inputs:
      profile:
        description: "Fuentes: fast (críticas), full (todas), process (solo cola)"
        type: choice
        options: ["full", "fast", "process"]
        default: "full"
      origin:
        description: "Etiqueta operativa del disparador; no es autenticación"
        type: choice
        options: ["manual", "external"]
        default: "manual"
      mode:
        description: "Modo del ciclo; auto respeta MONITOR_MODE del repositorio"
        type: choice
        options: ["auto", "full", "capture-only", "process-only"]
        default: "auto"

# Un ciclo cada vez. Dos ejecuciones solapadas leerian la misma observacion y
# competirian por escribirla; la base lo aguanta, pero no hay nada que ganar.
concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  ciclo:
    runs-on: ubuntu-latest
    env:
      MONITOR_MODE: ${{ inputs.mode != 'auto' && inputs.mode || vars.MONITOR_MODE || 'full' }}
      MONITOR_PROFILE: ${{ github.event_name == 'schedule' && 'full' || inputs.profile || 'full' }}
      MONITOR_ORIGIN: ${{ github.event_name == 'schedule' && 'schedule' || inputs.origin || 'manual' }}
    # Una vuelta son ~40 s. Diez minutos es margen de sobra para una fuente lenta,
    # y el tope existe para que un `fetch` colgado no ocupe el grupo sin avanzar.
    timeout-minutes: 10
    steps:
      # v5 en las dos: v4 corre sobre Node 20, deprecado, y cada ejecucion salia
      # con el aviso. v5 pide runner >= 2.327.1, que el runner alojado supera de
      # sobra, y no cambia nada de lo que aqui se usa.
      - uses: actions/checkout@v5

      - name: Validar perfil antes de dependencias y secretos
        id: profile
        run: node scripts/validate-profile.mjs

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Ejecutar el ciclo
        run: npm start
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || secrets.GROQ }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LLM_PROVIDERS: ${{ vars.LLM_PROVIDERS }}
          GROQ_MODEL_SCORING: ${{ vars.GROQ_MODEL_SCORING }}
          GROQ_MODEL_ANALYSIS: ${{ vars.GROQ_MODEL_ANALYSIS }}
          # Vacío = openai/gpt-oss-20b ante 429 del principal; `none` lo apaga.
          GROQ_MODEL_FALLBACK: ${{ vars.GROQ_MODEL_FALLBACK }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # La SEC exige un contacto en el User-Agent; la watchlist dice en que
          # invierte Alberto. Las dos son secretos porque el repositorio es publico.
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          SEC_WATCHLIST: ${{ secrets.SEC_WATCHLIST }}
          WATCHLIST: ${{ secrets.WATCHLIST }}
          # Ajustes sin tocar el codigo: son "variables" del repositorio, no
          # secretos, porque no esconden nada. Vacias, mandan los valores por
          # defecto del codigo. Se cambian en Settings -> Secrets and variables
          # -> Actions -> Variables, o con `gh variable set ALERT_THRESHOLD`.
          ALERT_THRESHOLD: ${{ vars.ALERT_THRESHOLD }}
          DEEP_ANALYSIS_THRESHOLD: ${{ vars.DEEP_ANALYSIS_THRESHOLD }}
          # Estas dos faltaban, y su ausencia no se notaba: `loadConfig()` cae a
          # los modelos por defecto del codigo, asi que fijar la variable en el
          # repositorio no hacia absolutamente nada y la ejecucion seguia usando
          # el modelo de siempre. Un ajuste que no ajusta es peor que no tenerlo.
          MODEL_SCORING: ${{ vars.MODEL_SCORING }}
          MODEL_ANALYSIS: ${{ vars.MODEL_ANALYSIS }}
          MAX_SCORING_PER_CYCLE: ${{ vars.MAX_SCORING_PER_CYCLE }}
          MAX_DEEP_PER_CYCLE: ${{ vars.MAX_DEEP_PER_CYCLE }}
          MAX_ITEM_AGE_HOURS: ${{ vars.MAX_ITEM_AGE_HOURS }}
          GROUP_THRESHOLD: ${{ vars.GROUP_THRESHOLD }}
          EDGAR_FORMS: ${{ vars.EDGAR_FORMS }}
          RSS_FEEDS: ${{ vars.RSS_FEEDS }}
          RSS_FEED_BATCHES: ${{ vars.RSS_FEED_BATCHES }}
          SOURCE_CONCURRENCY: ${{ vars.SOURCE_CONCURRENCY }}
          SOURCE_TIMEOUT_MS: ${{ vars.SOURCE_TIMEOUT_MS }}
          COLLECTION_TIMEOUT_MS: ${{ vars.COLLECTION_TIMEOUT_MS }}
          EDGAR_MAX_FILINGS: ${{ vars.EDGAR_MAX_FILINGS }}
          QUEUE_SCAN_LIMIT: ${{ vars.QUEUE_SCAN_LIMIT }}
          PROCESSING_LEASE_MS: ${{ vars.PROCESSING_LEASE_MS }}
          RUN_TELEMETRY: ${{ vars.RUN_TELEMETRY }}
          NEWS_DELIVERY_MODE: ${{ vars.NEWS_DELIVERY_MODE }}
          BRIEF_NEWS_THRESHOLD: ${{ vars.BRIEF_NEWS_THRESHOLD }}
          WATCHLIST_IMPORTANT_THRESHOLD: ${{ vars.WATCHLIST_IMPORTANT_THRESHOLD }}
          BRIEF_NEWS_PER_HOUR: ${{ vars.BRIEF_NEWS_PER_HOUR }}
          BRIEF_NEWS_PER_DAY: ${{ vars.BRIEF_NEWS_PER_DAY }}
          IMPORTANT_NEWS_PER_HOUR: ${{ vars.IMPORTANT_NEWS_PER_HOUR }}
          IMPORTANT_NEWS_PER_DAY: ${{ vars.IMPORTANT_NEWS_PER_DAY }}
          BRIEF_BATCH_SIZE: ${{ vars.BRIEF_BATCH_SIZE }}
          BRIEF_INTERVAL_MINUTES: ${{ vars.BRIEF_INTERVAL_MINUTES }}
          MAX_PENDING_HOURS: ${{ vars.MAX_PENDING_HOURS }}
          AI_CALLS_PER_DAY: ${{ vars.AI_CALLS_PER_DAY }}
          AI_SCORING_INPUT_USD_PER_MILLION: ${{ vars.AI_SCORING_INPUT_USD_PER_MILLION }}
          AI_SCORING_OUTPUT_USD_PER_MILLION: ${{ vars.AI_SCORING_OUTPUT_USD_PER_MILLION }}
          AI_ANALYSIS_INPUT_USD_PER_MILLION: ${{ vars.AI_ANALYSIS_INPUT_USD_PER_MILLION }}
          AI_ANALYSIS_OUTPUT_USD_PER_MILLION: ${{ vars.AI_ANALYSIS_OUTPUT_USD_PER_MILLION }}

      # Un monitor que se cae en silencio es peor que no tener monitor: crees
      # que no pasa nada en los mercados cuando lo que pasa es que no corre.
      #
      # `failure()` a secas, y no `always()` ni `cancelled()`: con el grupo de
      # concurrencia, una ejecucion pendiente a la que otra sustituye acaba
      # CANCELADA, y avisar de eso serian avisos falsos todos los dias.
      - name: Avisar del fallo por Telegram
        if: ${{ failure() && steps.profile.outputs.valid == 'true' && env.MONITOR_MODE != 'capture-only' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Sin credenciales de Telegram: no se puede avisar del fallo."
            exit 0
          fi
          curl -sS -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=News Monitor: el ciclo ha fallado. $RUN_URL" \
            --data "disable_web_page_preview=true" > /dev/null
