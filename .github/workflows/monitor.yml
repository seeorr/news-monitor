# Ciclo de ingesta. Corre en el free tier de GitHub Actions, que es ILIMITADO
# porque el repositorio es publico. Por eso este cron puede ir a 15 minutos:
# en un repositorio privado, 2.880 ejecuciones al mes no caben en 2.000 minutos.
#
# Cron de GitHub: siempre UTC y con retrasos habituales de 5-15 minutos. Esto
# no sirve para alertas al segundo y no pretende servir.
name: Monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

# Un ciclo cada vez. Dos ejecuciones solapadas leerian la misma observacion y
# competirian por escribirla; la base lo aguanta, pero no hay nada que ganar.
concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  ciclo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Ejecutar el ciclo
        run: npm start
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Un monitor que se cae en silencio es peor que no tener monitor: crees
      # que no pasa nada en los mercados cuando lo que pasa es que no corre.
      - name: Avisar del fallo por Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Sin credenciales de Telegram: no se puede avisar del fallo."
            exit 0
          fi
          curl -sS -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=News Monitor: el ciclo ha fallado. $RUN_URL" \
            --data "disable_web_page_preview=true" > /dev/null
